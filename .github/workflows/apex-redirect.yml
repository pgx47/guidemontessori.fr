name: Apex redirect rule (one-shot)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Update apex -> www redirect rule
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          TOKEN = os.environ["CF_TOKEN"]
          API = "https://api.cloudflare.com/client/v4"
          HOST = "guidemontessori.fr"
          TARGET = "www.guidemontessori.fr"
          DESC = "Apex vers www (301)"

          def call(method, path, body=None):
              req = urllib.request.Request(
                  API + path,
                  method=method,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read())

          s, r = call("GET", f"/zones?name={HOST}")
          if s != 200 or not r.get("result"):
              print("zone lookup failed:", s, r)
              raise SystemExit(1)
          zone_id = r["result"][0]["id"]

          path = f"/zones/{zone_id}/rulesets/phases/http_request_dynamic_redirect/entrypoint"
          s, r = call("GET", path)
          if s != 200:
              print("get entrypoint failed:", s, r)
              raise SystemExit(1)
          existing = r["result"].get("rules") or []
          print("existing:", [x.get("description") for x in existing])

          cond = (
              f'(http.host eq "{HOST}" '
              'and not http.request.uri.path matches "^/[0-9a-f]{32}\\.txt$" '
              'and http.request.uri.path ne "/BingSiteAuth.xml")'
          )
          print("expression:", cond)

          rule = {
              "action": "redirect",
              "action_parameters": {
                  "from_value": {
                      "status_code": 301,
                      "target_url": {
                          "expression": f'concat("https://{TARGET}", http.request.uri.path)'
                      },
                      "preserve_query_string": True,
                  }
              },
              "expression": cond,
              "description": DESC,
              "enabled": True,
          }

          rules = [x for x in existing if x.get("description") != DESC]
          rules.append(rule)
          s, r = call("PUT", path, {"rules": rules})
          print("put:", s, "success:", r.get("success"))
          if s != 200:
              print(json.dumps(r.get("errors"), ensure_ascii=False))
              raise SystemExit(1)
          for x in r["result"]["rules"]:
              print("->", x.get("description"), "|", x.get("expression"))
          PY
