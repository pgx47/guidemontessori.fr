name: Refresh Cadeaux

on:
  schedule:
    - cron: '0 4 2 * *'   # 2 du mois
  workflow_dispatch:

jobs:
  cadeaux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
        run: python scripts/fetch_cadeaux.py
      - run: |
          git config user.name "bot-montessori"
          git config user.email "bot@guidemontessori.fr"
          git add src/data/cadeaux.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update cadeaux du mois"
          git push

  deploy:
    needs: cadeaux
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
