name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm run build
          npm run check:site
        env:
          PUBLIC_AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          command: pages deploy dist --project-name=guidemontessori --branch=main --commit-dirty=true

      # Les cartes OG et les images sont régénérées à contenu d'URL constant :
      # sans purge, l'edge continue de servir l'ancienne version (cf. cartes OG
      # « carte de marque » restées en cache un an avec l'ancien `immutable`).
      - name: Purge Cloudflare cache
        if: success()
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ZONE=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=guidemontessori.fr" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"][0]["id"])')
          echo "zone: $ZONE"
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("purge:", d["success"]); sys.exit(0 if d["success"] else 1)'

      - name: Ping IndexNow
        if: success()
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'
        run: |
          pip install requests
          python scripts/ping_indexnow.py

      - name: Submit sitemap to Google Search Console
        if: success()
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install requests google-auth
          python scripts/ping_google.py
