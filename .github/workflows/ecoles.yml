name: Refresh Écoles

on:
  schedule:
    - cron: '0 4 5 * *'   # 5 du mois
  workflow_dispatch:

jobs:
  ecoles:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/fetch_ecoles.py
      - run: |
          git config user.name "bot-montessori"
          git config user.email "bot@guidemontessori.fr"
          git add src/data/ecoles.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update annuaire écoles"
          git push

  deploy:
    needs: ecoles
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
