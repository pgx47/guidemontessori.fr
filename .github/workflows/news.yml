name: Auto News Publisher

on:
  schedule:
    - cron: '0 7 * * 3,6'   # mercredi & samedi 7h UTC
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r scripts/requirements.txt
      - run: npm ci
      - run: python -m unittest discover -s scripts/tests -v
      - env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: python scripts/fetch_news.py
      - name: Validate build before publishing
        run: npm run build
      - run: |
          git config user.name "bot-montessori"
          git config user.email "bot@guidemontessori.fr"
          git add src/content/news/ src/data/news_state.json public/images/generated/
          git diff --cached --quiet && exit 0
          git commit -m "content: brève actualité"
          git push

  deploy:
    needs: news
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
