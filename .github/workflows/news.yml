name: Auto News Publisher

on:
  schedule:
    - cron: '0 7 * * 3,6'   # mercredi & samedi 7h UTC
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python scripts/fetch_news.py
      - run: |
          git config user.name "bot-montessori"
          git config user.email "bot@guidemontessori.fr"
          git add src/content/news/ src/data/news_state.json
          git diff --cached --quiet && exit 0
          git commit -m "content: brève actualité"
          git push

  deploy:
    needs: news
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
