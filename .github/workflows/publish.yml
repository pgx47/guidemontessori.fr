name: Auto Content Publisher

on:
  schedule:
    # Lundi, mercredi et vendredi à 6h UTC
    - cron: '0 6 * * 1,3,5'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Mot-clé (vide = prochain sujet pending de topics.json)'
        required: false
      type:
        description: 'guide ou news'
        default: guide

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: pip install -r scripts/requirements.txt
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s scripts/tests -v

      - name: Generate article
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          TOPIC: ${{ inputs.topic }}
          TYPE: ${{ inputs.type }}
        run: |
          if [ -n "$TOPIC" ]; then
            python scripts/generate_article.py --topic "$TOPIC" --type "${TYPE:-guide}"
          else
            python scripts/generate_article.py --auto
          fi

      - name: Validate build (schema Zod + MDX)
        run: |
          npm run build
          npm run check:site

      - name: Commit and push
        run: |
          git config user.name "bot-montessori"
          git config user.email "bot@guidemontessori.fr"
          git add src/content/ scripts/topics.json public/images/generated/
          git diff --cached --quiet && exit 0
          git commit -m "content: nouvel article"
          git push

  deploy:
    needs: publish
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
