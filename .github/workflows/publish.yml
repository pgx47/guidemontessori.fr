name: Auto Content Publisher

on:
  schedule:
    # Lun-Ven 6h UTC — la décision de publier est prise par l'étape "decide"
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Mot-clé (vide = prochain sujet pending de topics.json)'
        required: false
      type:
        description: 'guide ou news'
        default: guide

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: pip install -r scripts/requirements.txt
      - run: npm ci

      - name: Decide publish day (2-4 random weekdays per ISO week)
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import random, datetime, sys
          today = datetime.date.today()
          seed = int(today.strftime('%G%W'))
          days = sorted(random.Random(seed).sample(range(5), random.Random(seed + 1).randint(2, 4)))
          print(f"semaine {today.isocalendar()} → jours publiés : {days}, aujourd'hui {today.weekday()}")
          sys.exit(0 if today.weekday() in days else 78)
          PY
      - name: Generate article
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          TOPIC: ${{ inputs.topic }}
          TYPE: ${{ inputs.type }}
        run: |
          if [ -n "$TOPIC" ]; then
            python scripts/generate_article.py --topic "$TOPIC" --type "${TYPE:-guide}"
          else
            python scripts/generate_article.py --auto
          fi

      - name: Validate build (schema Zod + MDX)
        run: npm run build

      - name: Commit and push
        run: |
          git config user.name "bot-montessori"
          git config user.email "bot@guidemontessori.fr"
          git add src/content/ scripts/topics.json
          git diff --cached --quiet && exit 0
          git commit -m "content: nouvel article"
          git push

  deploy:
    needs: publish
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
